[package]
name = "filmz-engine"
description = "FilmZ engine façade: session, command registry, history, media pool"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Speech-to-text with Whisper (candle, CPU). Off by default and in wasm builds.
whisper = ["filmz-speech/whisper"]
# Speech-model downloads over HTTPS.
speech-download = ["filmz-speech/download"]
# Natural voices for Text to Speech: Kokoro-82M on candle (CPU) and their download.
neural-voices = ["filmz-tts/kokoro", "speech-download"]

[dependencies]
filmz-time = { workspace = true }
filmz-geom = { workspace = true }
filmz-color = { workspace = true }
filmz-frame = { workspace = true }
filmz-media = { workspace = true }
filmz-codecs = { workspace = true }
filmz-project = { workspace = true }
filmz-edit = { workspace = true }
filmz-render = { workspace = true }
filmz-scopes = { workspace = true }
filmz-text = { workspace = true }
filmz-audio-dsp = { workspace = true }
filmz-export = { workspace = true }
filmz-mxf = { workspace = true }
filmz-format = { workspace = true }
filmz-interchange = { workspace = true }
filmz-captions = { workspace = true }
filmz-speech = { workspace = true }
filmz-tts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
craft-docpath = { workspace = true }
web-time = "1"

[dev-dependencies]
filmz-testkit = { workspace = true }
filmz-dng = { workspace = true, features = ["writer"] }
filmz-isobmff = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
