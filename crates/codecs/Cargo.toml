[package]
name = "filmz-codecs"
description = "Container + codec hub: MP4/MOV, Matroska, MXF, Ogg and MPEG TS/PS sources, image sequences, GOP-aware seeking, decoder registry, audio decoding"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
craft-audio = { workspace = true }
craft-video = { workspace = true }
filmz-time = { workspace = true }
filmz-color = { workspace = true }
filmz-frame = { workspace = true }
filmz-media = { workspace = true }
filmz-isobmff = { workspace = true }
filmz-matroska = { workspace = true }
craft-media = { workspace = true, features = ["avi", "mpegts", "mxf", "ogg"] }
filmz-bitstream = { workspace = true }
filmz-vp8 = { workspace = true }
filmz-prores = { workspace = true }
filmz-dnx = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# Decode timing counters (`gop_stats`); std's Instant panics on wasm32.
web-time = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Bootstrap audio decoding (MPL-2.0, used unmodified); replaced by own decoders over time.
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "mp1", "mp2", "mp3", "flac", "alac", "pcm", "wav", "aiff", "ogg", "vorbis", "isomp4"] }

[dev-dependencies]
filmz-testkit = { workspace = true }
serde_json = { workspace = true }
