[package]
name = "filmz-export"
description = "Export pipeline: parallel render → encode → mux, presets, progress/cancel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
craft-audio = { workspace = true }
craft-jpeg = { git = "https://github.com/storytold/craft-libs", rev = "dc6adc3fbd9cf39e4a8210f94106a5b0c3e26e17" }
craft-exr = { workspace = true }
craft-png = { git = "https://github.com/storytold/craft-libs", rev = "34129bac990ea8ad5d2a8c58a4530cd83b56b810" }
craft-tga = { workspace = true }
craft-dpx = { workspace = true }
craft-video = { workspace = true }
filmz-time = { workspace = true }
filmz-frame = { workspace = true }
filmz-color = { workspace = true }
filmz-media = { workspace = true }
craft-media = { workspace = true, features = ["mxf"] }
filmz-codecs = { workspace = true }
filmz-project = { workspace = true }
filmz-render = { workspace = true }
filmz-audio-dsp = { workspace = true }
filmz-geom = { workspace = true }
filmz-text = { workspace = true }
filmz-isobmff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
log = { workspace = true }
web-time = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "tiff", "bmp"] }

[dev-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
filmz-testkit = { workspace = true }
