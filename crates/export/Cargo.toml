[package]
name = "filmz-export"
description = "Export pipeline: parallel render → encode → mux, presets, progress/cancel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
filmz-time = { workspace = true }
filmz-frame = { workspace = true }
filmz-color = { workspace = true }
filmz-media = { workspace = true }
filmz-project = { workspace = true }
filmz-render = { workspace = true }
filmz-audio-dsp = { workspace = true }
filmz-geom = { workspace = true }
filmz-text = { workspace = true }
filmz-isobmff = { workspace = true }
filmz-prores = { workspace = true }
filmz-dnx = { workspace = true }
filmz-apv = { workspace = true }
filmz-mxf = { workspace = true }
filmz-aac = { workspace = true }
filmz-flac = { workspace = true }
filmz-h264enc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
web-time = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "tiff", "bmp"] }

[dev-dependencies]
filmz-testkit = { workspace = true }
filmz-codecs = { workspace = true }
