[package]
name = "filmz-prores"
description = "Clean-room Apple ProRes (SMPTE RDD 36) decoder and encoder"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["threads"]
threads = ["dep:rayon"]

[dependencies]
filmz-bitstream = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true, optional = true }

[dev-dependencies]
filmz-testkit = { workspace = true }
