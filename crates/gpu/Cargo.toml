[package]
name = "filmz-gpu"
description = "wgpu compositor: YUV/RGB layer sampling, linear-light premultiplied compositing in WGSL"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
filmz-color = { workspace = true }
filmz-frame = { workspace = true }
filmz-geom = { workspace = true }
filmz-project = { workspace = true }
filmz-render = { workspace = true }
filmz-time = { workspace = true }
wgpu = { version = "30", default-features = false, features = ["wgsl"] }
log = { workspace = true }
pollster = "1"
rayon = { workspace = true }

[dev-dependencies]
pollster = "1"
filmz-export = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
wgpu = { version = "30", features = ["wgsl", "metal", "vulkan", "dx12", "gles"] }
filmz-media = { workspace = true }
filmz-time = { workspace = true }
