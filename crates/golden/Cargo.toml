[package]
name = "filmz-golden"
description = "Golden-image tests for the CPU renderer/compositor and GPU-vs-CPU parity (test-only crate)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# Test-only: the library is empty and everything is a dev-dependency, so the crate adds no edges
# to the layer graph. Goldens live in `goldens/` (see docs/testing.md §3).
[dependencies]

[dev-dependencies]
filmz-testkit = { workspace = true }
filmz-color = { workspace = true }
filmz-frame = { workspace = true }
filmz-time = { workspace = true }
filmz-geom = { workspace = true }
filmz-media = { workspace = true }
filmz-project = { workspace = true }
filmz-render = { workspace = true }
filmz-gpu = { workspace = true }
pollster = "1"
wgpu = { version = "30", features = ["wgsl", "metal", "vulkan", "dx12", "gles"] }
