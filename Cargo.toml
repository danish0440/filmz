[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.20.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/danish0440/filmz"

[workspace.dependencies]
# internal
filmz-time = { path = "crates/time" }
filmz-geom = { path = "crates/geom" }
filmz-color = { path = "crates/color" }
filmz-bitstream = { path = "crates/bitstream" }
filmz-isobmff = { path = "crates/isobmff" }
filmz-matroska = { path = "crates/matroska" }
filmz-cfb = { path = "crates/cfb" }
filmz-prores = { path = "crates/prores" }
filmz-dnx = { path = "crates/dnx" }
filmz-dng = { path = "crates/dng" }
filmz-h264enc = { path = "crates/h264enc" }
filmz-audio-dsp = { path = "crates/audio-dsp" }
filmz-frame = { path = "crates/frame" }
filmz-media = { path = "crates/media" }
filmz-codecs = { path = "crates/codecs" }
filmz-project = { path = "crates/project" }
filmz-edit = { path = "crates/edit" }
filmz-interchange = { path = "crates/interchange" }
filmz-text = { path = "crates/text" }
filmz-captions = { path = "crates/captions" }
filmz-speech = { path = "crates/speech" }
filmz-tts = { path = "crates/tts" }
filmz-tts-text = { path = "crates/tts-text" }
filmz-render = { path = "crates/render" }
filmz-gpu = { path = "crates/gpu" }
filmz-scopes = { path = "crates/scopes" }
filmz-export = { path = "crates/export" }
filmz-format = { path = "crates/format" }
filmz-engine = { path = "crates/engine" }
filmz-ui-egui = { path = "crates/ui-egui" }
filmz-automation = { path = "crates/automation" }
filmz-platform = { path = "crates/platform" }
filmz-testkit = { path = "crates/testkit" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
url = "2.5.8"
log = "0.4"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
rayon = "1"
proptest = "1"
roxmltree = "0.21"
craft-docpath = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "c3a39369ce4f8c8494fd5e70d4a9f63ad3d0d09a" }
# The audio codecs (AAC, AC-3, FLAC, MP1/MP2, Opus) and the containers come from craft-libs. Both
# are on one commit, so the types they share (CodecParams, ByteSource) are the same.
craft-media = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "c3a39369ce4f8c8494fd5e70d4a9f63ad3d0d09a", default-features = false }
craft-audio = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "c3a39369ce4f8c8494fd5e70d4a9f63ad3d0d09a", default-features = false, features = ["aac-decode", "aac-encode", "rayon", "ac3-decode", "mpa-decode", "opus-decode", "flac-encode", "mp3-encode"] }
# The video decoders (H.264, HEVC, VP9, AV1, MPEG-2, APV with its encoder), on the same commit as craft-media.
craft-video = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "c3a39369ce4f8c8494fd5e70d4a9f63ad3d0d09a", features = ["h264-decode", "hevc-decode", "vp9-decode", "av1-decode", "vp8-decode", "mpeg2", "apv", "threads"] }
# Exact time, EDL / ALE and the interchange report; serde for the project file's time fields.
craft-timeline = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "c3a39369ce4f8c8494fd5e70d4a9f63ad3d0d09a", features = ["serde"] }
craft-captions = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "c3a39369ce4f8c8494fd5e70d4a9f63ad3d0d09a" }

# ui
# Shared frontend components; keep this dependency above the engine boundary.
craft-ui = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "c3a39369ce4f8c8494fd5e70d4a9f63ad3d0d09a", features = ["serde", "native-windows"] }
# egui 0.37: bundled fonts are opt-in, and the monochrome symbol/emoji faces moved to their own
# feature. FilmZ paints ✔ ✓ ✖ ⚡ ⚠ ⚙ ♪ ☑ in panel chrome, so both features are part of the
# production font policy (system_fonts stays off).
egui = { version = "0.37", features = ["default_fonts", "monochrome_emoji_fonts"] }
# Resizable table columns (About ▸ Contributors / Models); no image loaders.
egui_extras = { version = "0.37", default-features = false }
eframe = { version = "0.37", default-features = false }
egui_kittest = "0.37"
# craft-update: app-specific pretend versions apply to startup and manual checks.
craft-update = { git = "https://github.com/storytold/craft-libs", version = "=0.1.0", rev = "c3a39369ce4f8c8494fd5e70d4a9f63ad3d0d09a", features = ["egui"] }
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
needless_range_loop = "allow"
type_complexity = "allow"

# Line tables keep file and line in panics and backtraces at a fraction of full debug info's size;
# dependencies need none.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

# Codec hot loops: debug-build tests (RFC/oracle vectors) are minutes slower below opt-level 3.
[profile.dev.package.filmz-h264enc]
opt-level = 3

[profile.dev.package.filmz-prores]
opt-level = 3

[profile.dev.package.filmz-dnx]
opt-level = 3

[profile.dev.package.filmz-dng]
opt-level = 3

[profile.dev.package.craft-audio]
opt-level = 3

[profile.dev.package.craft-video]
opt-level = 3

# Audio effects: realtime-factor tests and long convolution / spectral runs.
[profile.dev.package.filmz-audio-dsp]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# Keep the complete egui family and native event bridge on reviewed fork commits.
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_extras = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_system_font_provider = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_demo_lib = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_inspection = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
